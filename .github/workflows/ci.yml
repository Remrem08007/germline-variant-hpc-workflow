name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: nf-core/setup-nextflow@v2
        with:
          version: '26.04.4'
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Shell syntax
        run: |
          bash -n scripts/*.sh scripts/*.sbatch scripts/lib/*.sh
      - name: Nextflow stub workflow
        run: nextflow run main.nf -profile test -stub-run
