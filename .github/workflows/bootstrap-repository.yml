name: Materialize repository

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/bootstrap-repository.yml
      - .bootstrap/trigger

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct packaged repository
        shell: bash
        run: |
          set -euo pipefail

          cat .bootstrap/archive.part* > "$RUNNER_TEMP/repo.tar.gz.b64"
          base64 --decode "$RUNNER_TEMP/repo.tar.gz.b64" > "$RUNNER_TEMP/repo.tar.gz"
          echo "098a794c971d7e1435ff6f2b2fe8b11d0e38f54cc8e1caf5da6b6b61c6597be2  $RUNNER_TEMP/repo.tar.gz" | sha256sum -c -

          mkdir -p "$RUNNER_TEMP/repo"
          tar -xzf "$RUNNER_TEMP/repo.tar.gz" \
            --strip-components=1 \
            -C "$RUNNER_TEMP/repo"

          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "$RUNNER_TEMP/repo/." .

          rm -f .github/workflows/bootstrap-repository.yml
          rm -rf .bootstrap

      - name: Commit repository
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish germline variant HPC workflow v0.1.0"
          git push origin HEAD:main
